<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css">
    
</head>
<body>
    <div class="container">
        <form >
            <div class="form-group">
                <label for="nome"> Primeiro Nome:</label><br>
                <input type="text" id="nome" name="nome" class="form-control"><br>
            </div>
            

            <div class="form-group">
                <label for="tipo">Pessoa</label><br>
                <input type="text" id="tipo" name="tipo" class="form-control"><br>
                <select name="tipo" id="tipo">
                    <option value="PF">PF</option>
                    <option value="PJ">PJ</option>
                </select><br>
            </div>
           
            <div class="form-group">
                <label for="tipo">Tipo de Pessoa</label><br>
                <select class="form-control" id="tipos">
                    <option>PF</option>
                    <option>PJ</option>
                </select><br>
            </div>

            <div class="form-group">
                <label for="cpf"> CPF: </label><br>
                <input type="text" id="cpf" name="cpf" class="form-control"><br>
                
            </div>
            
            <div class="form-group">
                <label for="data"> Data </label><br>
                <input type="date" class="form-control"><br>
            </div>
            
            <div class="form-group">
                <label for="endereço"> Endereço </label><br>
                <input type="text" class="form-control"><br>
            </div>
            
            <div class="form-group">
                <label for="bairro"> Bairro </label><br>
                <input type="text" class="form-control"><br>
            </div>
            
            <div class="form-group">
                <label for="cep"> CEP </label><br>
                <input type="text" class="form-control"><br>
            </div>
            

            <div class="form-group">
                <label for="estado"> Estado</label><br>
                <select name="form-control" id="estado"><br>
                    <option value="AC">AC</option>
                    <option value="AL">AL</option>
                    <option value="AP">AP</option>
                    <option value="AM">AM</option>
                    <option value="BA">BA</option>
                    <option value="CE">CE</option>
                    <option value="ES">ES</option>
                    <option value="GO">GO</option>
                    <option value="MA">MA</option>
                    <option value="MT">MT</option>
                    <option value="MS">MS</option>
                    <option value="RJ">RJ</option>
                </select><br>
            </div>
            
            <div class="form-group">
                <label for="cidade"> Cidade </label><br>
                <input type="cidade" class="form-control"><br>
            </div>
            
            <div class="form-group">
                <label for="telefone"> Telefone </label><br>
                <input type="text" class="form-control"><br>
            </div>
            

            <div class="form-group">
                <label for="celular"> Celular </label><br>
                <input type="text" class="form-control"><br>
            </div>
            

            <div class="form-group">
                <label for="inscricao"> Inscrição Estadual </label><br>
                <input type="text" class="form-control"><br>
            </div>
            
            <div class="form-group">
                <label for="observacao"> Observações </label><br>
                <textarea name="observacao" id="" cols="30" rows="5"></textarea><br>
            </div>
            
            <div>
                <button type="salvar" class="btn btn-primary">Salvar</button>
            </div>
           
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" 
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" 
    crossorigin="anonymous"></script>

</body>
</html>
