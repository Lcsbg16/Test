<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <form >
        <label for="nome"> Primeiro Nome:</label><br>
        <input type="text" id="nome" name="nome"><br>

        <label for="tipo">Pessoa</label><br>
        <select name="tipo" id="tipo">
            <option value="PF">PF</option>
            <option value="PJ">PJ</option>
        </select><br>

        <label for="cpf"> CPF: </label><br>
        <input type="text" id="cpf" name="cpf"><br>

        <label for="data"> Data </label><br>
        <input type="date"><br>

        <label for="endereço"> Endereço </label><br>
        <input type="text"><br>

        <label for="bairro"> Bairro </label><br>
        <input type="text"><br>

        <label for="cep"> CEP </label><br>
        <input type="text"><br>

        <label for="estado"> Estado</label><br>
        <select name="estado" id="estado"><br>
            <option value="AC">AC</option>
            <option value="AL">AL</option>
            <option value="AP">AP</option>
            <option value="AM">AM</option>
            <option value="BA">BA</option>
            <option value="CE">CE</option>
            <option value="ES">ES</option>
            <option value="GO">GO</option>
            <option value="MA">MA</option>
            <option value="MT">MT</option>
            <option value="MS">MS</option>
            <option value="RJ">RJ</option>
        </select><br>

        <label for="cidade"> Cidade </label><br>
        <input type="cidade"><br>

        <label for="telefone"> Telefone </label><br>
        <input type="text"><br>

        <label for="celular"> Celular </label><br>
        <input type="text"><br>

        <label for="inscricao"> Inscrição Estadual </label><br>
        <input type="text"><br>

        <label for="observacao"> Observações </label><br>
        <textarea name="observacao" id="" cols="30" rows="5"></textarea><br>
        
        <button type="salvar">Salvar</button>
    </form>
</body>
</html>
